name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find and Rename APK
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/*.apk build-artifacts/NdikaNime-debug.apk || cp app/build/outputs/apk/*/*/*.apk build-artifacts/ || true
          ls -la build-artifacts/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NdikaNime-debug-apk
          path: build-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
